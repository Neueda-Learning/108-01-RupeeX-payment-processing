spring.application.name=rupeeX

# All servlet-mapped endpoints (REST controllers, actuator, swagger, websocket)
# are served under this context path. This lets a single nginx reverse proxy
# in front of the app/frontend containers route "/api/**" to this backend and
# everything else to the Next.js frontend, without path collisions (both apps
# have routes named e.g. /accounts, /payments, /events).
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# Behind the nginx reverse proxy, trust X-Forwarded-* headers to compute the
# request's scheme/host/port. Without this, Spring/Tomcat may derive the
# wrong server port for the incoming request, causing it to misdetect
# same-origin browser requests as cross-origin and reject them with a bogus
# CORS 403 ("Invalid CORS request").
server.forward-headers-strategy=framework

# Explicitly configure Tomcat's RemoteIpFilter to handle forwarded headers.
# This ensures the servlet's getServerPort(), getServerName(), and getScheme()
# reflect the original client request, not Tomcat's internal listening port.
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.port-header=X-Forwarded-Port
server.tomcat.remoteip.host-header=X-Forwarded-Host

# Datasource configured from environment variables (docker-compose supplies these)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rupeex_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&allowZeroDatetime=true&zeroDateTimeBehavior=convertToNull}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rupeex}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rupeex}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG_LEVEL:INFO}

# HTTP Problem Details (RFC 7807)
spring.mvc.problemdetails.enabled=true

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.show-actuator=false
springdoc.default-flat-param-object=false
springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Processing defaults
payment.processing.max-retries=${PAYMENT_MAX_RETRIES:3}
payment.processing.base-delay-ms=${PAYMENT_BASE_DELAY_MS:500}
payment.processing.failure-rate=${PAYMENT_FAILURE_RATE:0.2}
payment.processing.queue-poll-interval-ms=${PAYMENT_QUEUE_POLL_INTERVAL_MS:1000}

# Mail config
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Notification sender
notification.mail.from=${MAIL_FROM:no-reply@rupeex.local}


# Exchange rate API
exchange.api.url=https://v6.exchangerate-api.com/v6
exchange.api.key=YOUR_API_KEY