<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#f97316"/>

  <!-- Inner glow ring -->
  <circle cx="100" cy="100" r="88" fill="#ea580c" opacity="0.5"/>

  <!-- Subtle diagonal accent -->
  <line x1="30" y1="170" x2="170" y2="30" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.15"/>

  <!-- ₹ symbol -->
  <text x="52" y="132" font-family="Georgia, serif" font-size="95" font-weight="bold" fill="white" letter-spacing="-4">₹</text>

  <!-- X accent mark -->
  <text x="118" y="155" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white" opacity="0.95">X</text>

  <!-- Bottom highlight arc -->
  <path d="M 40 160 Q 100 185 160 160" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.25"/>
</svg>

