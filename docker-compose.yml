services:
  db:
    image: mysql:8.0
    container_name: rupeex-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rupeex_db}
      MYSQL_USER: ${MYSQL_USER:-rupeex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rupeex}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: ./backend
    container_name: rupeex-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/rupeex_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-rupeex}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-rupeex}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
  
      OTP_FALLBACK_ENABLED: ${OTP_FALLBACK_ENABLED:-true}
    volumes:
      - ./backend/logs:/app/logs
    ports:
      - "127.0.0.1:8082:8080"
    restart: on-failure

  onboarding-app:
    build: ./onboarding-service
    container_name: rupeex-onboarding-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/rupeex_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-rupeex}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-rupeex}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${ONBOARDING_SERVER_PORT:-8083}
      # Context path must always be /onboarding to match nginx routing and
      # the controller mappings (same pattern as the main app using /api).
      # Explicitly set here so it cannot be accidentally overridden by .env.
      SERVER_SERVLET_CONTEXT_PATH: /onboarding
      # Payment service URL with /api context path for REST endpoints
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://app:8080/api}
    ports:
      - "${ONBOARDING_HTTP_PORT:-8083}:8083"
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: rupeex-frontend
    depends_on:
      - app
      - onboarding-app
    environment:
      # Server-side base URL the frontend uses to reach the backend.
      # Uses the docker-compose service name `app`, resolvable on the
      # internal compose network. Includes the /api context path.
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://app:8080/api}
      # Browser-side base URL used by client components. Left unset so the
      # browser calls the backend through nginx at the same origin (/api).
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      # Server-side base URL for onboarding service (docker network).
      # Includes /onboarding path to match controller @RequestMapping.
      ONBOARDING_BASE_URL: ${ONBOARDING_BASE_URL:-http://onboarding-app:8083/onboarding}
      # Browser-side base URL for onboarding (through nginx at same origin).
      # Should be empty so browser makes requests to same origin via /onboarding/ nginx location.
      NEXT_PUBLIC_ONBOARDING_BASE_URL: ${NEXT_PUBLIC_ONBOARDING_BASE_URL:-}
      # Server-side base URL the frontend's /api/bot proxy route uses to
      # reach the bot-service, resolvable on the internal compose network.
      BOT_SERVICE_URL: ${BOT_SERVICE_URL:-http://bot-service:4001}
      PORT: 3000
    ports:
      # Bound to localhost only, see note on the `app` service above.
      - "127.0.0.1:8000:3000"
    restart: on-failure

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rupeex-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: on-failure

  # On-premise LLM + embedding runtime for the bot service. Fully
  # containerized — nothing to install on the host. Models persist in the
  # `ollama_data` volume so they're only pulled once.
  ollama:
    image: ollama/ollama:latest
    container_name: rupeex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

  # One-shot init job: pulls the chat model and the embedding model into the
  # shared `ollama_data` volume, then exits. bot-service/bot-worker don't
  # depend on this completing — the SLM/RAG features fall back to rule-based
  # parsing until the pull finishes.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: rupeex-ollama-pull
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c"]
    command: >
      "ollama serve & sleep 3 &&
       ollama pull ${SLM_MODEL:-qwen2.5:0.5b} &&
       ollama pull ${EMBED_MODEL:-nomic-embed-text} &&
       echo 'model pull complete'"
    depends_on:
      - ollama

  bot-service:
    build:
      context: ./bot-service
    container_name: rupeex-bot-service
    environment:
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672
      - PAYMENT_API_URL=http://app:8080/api
      - BOT_HIGH_VALUE_THRESHOLD=100000
      # On-premise SLM + embeddings served by the containerized `ollama` service.
      - SLM_ENABLED=true
      - SLM_BASE_URL=http://ollama:11434
      - SLM_MODEL=qwen2.5:0.5b
      # CPU-only inference is slow, especially on cold start; give it room
      # before falling back to the rule-based parser.
      - SLM_TIMEOUT_MS=25000
      - RAG_ENABLED=true
      - EMBED_MODEL=nomic-embed-text
      - RAG_TOP_K=3
    ports:
      - "4001:4001"
    depends_on:
      - rabbitmq
      - ollama
      - app
    restart: on-failure

  bot-worker:
    build:
      context: ./bot-service
    container_name: rupeex-bot-worker
    command: ["node", "dist/worker.js"]
    environment:
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672
      - PAYMENT_API_URL=http://app:8080/api
    depends_on:
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started
    restart: on-failure

  nginx:
    image: nginx:1.27-alpine
    container_name: rupeex-nginx
    depends_on:
      - app
      - frontend
      - onboarding-app
      - bot-service
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    restart: always

volumes:
  db_data:
  ollama_data:
