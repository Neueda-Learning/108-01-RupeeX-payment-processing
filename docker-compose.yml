services:
  db:
    image: mysql:8.0
    container_name: rupeex-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rupeex_db}
      MYSQL_USER: ${MYSQL_USER:-rupeex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rupeex}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    container_name: rupeex-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/rupeex_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-rupeex}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-rupeex}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "127.0.0.1:8082:8080"
    restart: on-failure

  onboarding-app:
    build: ./onboarding-service
    container_name: rupeex-onboarding-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/rupeex_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-rupeex}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-rupeex}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${ONBOARDING_SERVER_PORT:-8083}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://app:8080}
    ports:
      - "${ONBOARDING_HTTP_PORT:-8083}:8083"
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: rupeex-frontend
    depends_on:
      - app
      - onboarding-app
    environment:
      ONBOARDING_BASE_URL: ${ONBOARDING_BASE_URL:-http://onboarding-app:8083}
      NEXT_PUBLIC_ONBOARDING_BASE_URL: ${NEXT_PUBLIC_ONBOARDING_BASE_URL:-http://localhost:8083}
      # Server-side base URL the frontend uses to reach the backend.
      # Uses the docker-compose service name `app`, resolvable on the
      # internal compose network. Includes the /api context path.
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://app:8080/api}
      # Browser-side base URL used by client components. Left unset so the
      # browser calls the backend through nginx at the same origin (/api).
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      PORT: 3000
    ports:
      # Bound to localhost only, see note on the `app` service above.
      - "127.0.0.1:8000:3000"
    restart: on-failure

  nginx:
    image: nginx:1.27-alpine
    container_name: rupeex-nginx
    depends_on:
      - app
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    restart: always

volumes:
  db_data:
