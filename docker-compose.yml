services:
  db:
    image: mysql:8.0
    container_name: rupeex-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rupeex}
      MYSQL_USER: ${MYSQL_USER:-rupeex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: rupeex-app
    depends_on:
      - db
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/rupeex?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-rupeex}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "8081:8080"
    restart: on-failure

  onboarding:
    build: ./onboarding-service
    container_name: rupeex-onboarding
    depends_on:
      - db
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${ONBOARDING_SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/rupeex?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-rupeex}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${ONBOARDING_SERVER_PORT:-8090}
    ports:
      - "8091:8090"
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: rupeex-frontend
    depends_on:
      - app
    environment:
      # Server-side base URL the frontend uses to reach the backend.
      # Uses the docker-compose service name `app`, resolvable on the
      # internal compose network.
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://app:8080}
      PORT: 3000
    ports:
      - "8002:3000"
    restart: on-failure

volumes:
  db_data:
