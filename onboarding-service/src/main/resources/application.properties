spring.application.name=onboarding-service

# Onboarding service runs at root context. Nginx proxy handles /onboarding/* routing.
# No servlet context path needed since nginx strips the /onboarding/ prefix before
# forwarding the request to this service.

# Behind the nginx reverse proxy, trust X-Forwarded-* headers to compute the
# request's scheme/host/port. Without this, Spring/Tomcat may derive the
# wrong server port for the incoming request, causing CORS issues.
server.forward-headers-strategy=framework

# Explicitly configure Tomcat's RemoteIpFilter to handle forwarded headers.
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.port-header=X-Forwarded-Port
server.tomcat.remoteip.host-header=X-Forwarded-Host

server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rupeex_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Payment service URL for account creation on customer approval
# Includes /api context path since payment service serves all endpoints under /api
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8080/api}

logging.level.org.hibernate.SQL=WARN


